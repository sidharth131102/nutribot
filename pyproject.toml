[project]
name = "nutribot"
version = "2.0.0"
description = "Production-grade AI nutrition assistant — 8-agent LangGraph pipeline with Claude, MongoDB, ChromaDB."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Pydantic & settings
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pydantic[email]>=2.8.0",

    # MongoDB (async)
    "motor>=3.5.0",
    "pymongo>=4.8.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",

    # LangChain / LangGraph
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.50",

    # Vector DB (with local embeddings — no API key needed)
    "chromadb>=0.5.0",

    # PDF parsing
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",

    # Email
    "sendgrid>=6.11.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
]
