[project]
name = "nutribot"
version = "2.0.0"
description = "Production-grade AI nutrition assistant — 8-agent LangGraph pipeline with Groq, MongoDB, Pinecone."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Pydantic & settings
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pydantic[email]>=2.8.0",

    # MongoDB (async)
    "motor>=3.5.0",
    "pymongo>=4.8.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",

    # LangChain / LangGraph
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.50",

    # Vector DB (hosted, integrated embeddings)
    "pinecone>=5.1.0",

    # PDF parsing
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",

    # Email
    "sendgrid>=6.11.0",

    # JSON repair (LLM-generated JSON occasionally has minor syntax errors)
    "json-repair>=0.63.4",

    # Azure Blob Storage + Document Intelligence (Phase 4: medical documents)
    "azure-storage-blob>=12.23.0",
    "azure-ai-documentintelligence>=1.0.0",

    # Hybrid retrieval (Phase 5: RAG 2.0)
    "rank-bm25>=0.2.2",

    # LangSmith tracing (Phase 6) -- promoted from transitive (pulled in by
    # langchain*) to a direct dependency now that it's actually configured
    "langsmith>=0.7.26",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mongomock-motor>=0.0.36",

    # Eval harness only (Phase 6) -- never imported by backend/agents or
    # backend/guardrails, never installed in the Vercel production build
    "deepeval>=2.0.0",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
